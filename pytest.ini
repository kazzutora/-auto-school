[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
testpaths = tests
python_files = test_*.py
# Tests are functions here. Left at the default, pytest tries to collect any
# imported model whose name starts with Test, such as reviews.Testimonial.
python_classes =
# owner_data is a release gate, not a build gate: it stays red until the
# owner supplies the missing content. Run it with `pytest -m owner_data`.
addopts = -q --strict-markers -m "not owner_data"

markers =
    redirects: legacy url table from data/legacy/redirects.csv answers 301 (tech.md 4.8)
    seo: seo contract of a public page: h1, title, description, canonical, json-ld (tech.md 8)
    a11y: accessibility checks, non-empty img alt above all (tech.md 9)
    owner_data: content the owner still owes, blocks production release (tech.md 16)
