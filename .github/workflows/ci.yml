name: CI

# Gate on pull requests, no deploy. tech.md section 17.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TAILWIND_VERSION: "3.4.17"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    name: ruff, mypy and the commit log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit message check reads the range this pull request adds.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        # PEP 735 dependency groups need pip 25.1 or newer.
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e . --group dev

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps/

      - name: Commit messages
        # tech.md section 12: type(scope): summary, one of a fixed set of
        # types, imperative, lower case, no full stop, about 50 characters.
        # Only the commits this pull request adds are judged — history is not
        # rewritten to satisfy a rule added later.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge*|Revert*) continue ;;
            esac
            if ! printf '%s' "$subject"               | grep -qE '^(feat|fix|test|refactor|chore|docs|perf|ci)(\([a-z0-9-]+\))?: [a-z]'; then
              echo "::error::not type(scope): summary — $subject"
              fail=1
            fi
            case "$subject" in
              *.) echo "::error::ends with a full stop — $subject"; fail=1 ;;
            esac
            if [ "${#subject}" -gt 52 ]; then
              echo "::error::${#subject} characters, the limit is about 50 — $subject"
              fail=1
            fi
          done <<< "$(git log --format=%s "$BASE..$HEAD")"
          exit $fail

  test:
    name: migrations and pytest
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: osk
          POSTGRES_USER: osk
          POSTGRES_PASSWORD: osk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osk -d osk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://osk:osk@localhost:5432/osk
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e . --group dev

      - name: Postgres client
        # core.tasks.db_backup shells out to pg_dump, and pg_dump refuses to
        # dump a server newer than itself. Ubuntu 24.04 carries 16.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: No unmade migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Build the stylesheet
        # The size budget measures the built file, REDESIGN.md C.6. Without this
        # step it has nothing to measure and skips, which is a gate that does
        # not gate. Same standalone binary the tailwind stage of the Dockerfile
        # uses: no node in CI either.
        run: |
          RELEASE="https://github.com/tailwindlabs/tailwindcss/releases/download"
          curl -fsSL -o ./tailwindcss "$RELEASE/v$TAILWIND_VERSION/tailwindcss-linux-x64"
          chmod +x ./tailwindcss
          ./tailwindcss -i static/src/css/app.css -o static/css/app.css --minify
          ./tailwindcss -i static/src/css/motion.css -o static/css/motion.css --minify

      - name: Asset budget, contrast and font coverage
        # Three gates, ROSE.md K2. The first fails the build when the css or js
        # grows past REDESIGN.md C.6; the second when a pair of tokens the
        # design actually puts on screen drops under its threshold, ROSE.md
        # B.3; the third when a face stops covering the polish diacritics or
        # cyrillic, B.4 — the fault that dropped every russian paragraph into
        # the system sans before core v25 and every heading before v29.
        run: |
          python scripts/check_budget.py
          python scripts/check_contrast.py
          python scripts/check_fonts.py

      - name: Tests
        # e2e runs against the built image in its own job.
        run: pytest -q --cov=apps --cov-fail-under=80 --ignore=tests/e2e

  e2e:
    name: playwright on the built image
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: osk
          POSTGRES_USER: osk
          POSTGRES_PASSWORD: osk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osk -d osk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: osk-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the css
        # The built stylesheet is a build artifact and is not committed, so the
        # browser would otherwise load an unstyled page and the layout
        # assertions would be meaningless.
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss -i static/src/css/app.css -o static/css/app.css --minify
          tailwindcss -i static/src/css/motion.css -o static/css/motion.css --minify

      - name: End to end
        # Host networking so the container reaches the service containers, which
        # github publishes on the runner's localhost. The image entrypoint waits
        # for postgres before handing over to pytest.
        run: |
          docker run --rm --network host \
            -v "$PWD:/app" -w /app \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            -e DATABASE_URL=postgres://osk:osk@localhost:5432/osk \
            -e REDIS_URL=redis://localhost:6379/0 \
            --entrypoint sh osk-dev:ci -c \
            "playwright install chromium >/dev/null && pytest tests/e2e -q"

  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: osk:ci
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
