<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
Vehicle blueprints, one per course category.

A second sprite rather than more symbols in static/icons/sprite.svg: those are
24px pictograms on a 1.75 stroke, read at a glance beside a word. These are
side elevations on a 720x240 field with a hairline stroke, read as a drawing at
a third of a page. One file for both would mean one viewBox for two jobs and a
stroke width that suits neither.

Every line is currentColor on no fill, so a drawing takes the ink of whatever
ground it stands on and reads on the light page and on the inverted band alike.
The stroke scales with the drawing rather than staying a fixed hairline: at a
third of the page it wants 2px, and in a small panel it should thin out with
everything else.

Every wheel sits on y=234 and the ground line is drawn there, so the vehicles
line up with each other when two of them are placed side by side.

Drawn here rather than traced from a photograph or someone's blueprint: this is
the school's own artwork, with nobody else's copyright in it.
-->
