    <path stroke-width="1.4" d="M296 118 h34 M372 116 h34" />
    <path stroke-width="1.4" d="M44 140 L84 132 L84 150 L44 156 Z" />
    <path stroke-width="1.4" d="M660 132 L696 142 L696 160 L662 152 Z" />
    <circle cx="180" cy="188" r="46" />
    <circle cx="180" cy="188" r="28" stroke-width="1.4" />
    <circle cx="180" cy="188" r="7" stroke-width="1.4" />
