  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 188 L40 152 C42 132 58 120 84 114 L164 98 C208 74 246 60 300 54 C372 46 436 50 486 62 C534 74 580 92 620 110 L668 122 C690 128 700 140 700 158 L700 188" />
