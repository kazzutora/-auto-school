<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    Icon sprite, FRONTEND.md A.7. 24px grid, 1.75 stroke, currentColor, round
    caps and joins. Self hosted like everything else, tech.md section 2.

    Use: <svg class="h-6 w-6" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#i-phone"></use></svg>

    The stroke lives in presentation attributes on every symbol rather than in
    a <style> block. A <use> that points at another file clones the symbol into
    a shadow tree in the host document, and a stylesheet inside this file does
    not reliably travel with it; presentation attributes are part of the nodes
    and always do. currentColor is the one thing left to the page, which is the
    point: an icon takes the colour of the text beside it.

    An icon never stands alone in place of a word. The two that do, the burger
    and the close button, carry an aria-label instead, A.7.
  -->

  <!--
    The four social marks, and the only symbols here that are filled
    rather than stroked.

    They are the brands' own shapes, because that is the whole job: a
    reader scanning a footer recognises the glyph and nothing else. The
    first attempt drew them on the 1.75 stroke grid like every other icon
    in this file, and the result was three rounded squares nobody could
    tell apart. Consistency with the sprite is worth less than being
    understood.

    currentColor, not each brand's own blue, pink and red: the mark is
    recognised by its shape, and four brand colours in a row is four logos
    competing with the page. Each link carries an aria-label, so the glyph
    never has to be read.
  -->
  <symbol id="i-facebook" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
  </symbol>
