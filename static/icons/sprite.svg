  <!-- Not in A.7's list, which calls itself a minimum. A.9 point 7 puts a star
       rating on every testimonial, and the alternative is a dingbat character,
       which would be the one place in the interface where an icon is text. The
       filled half of the rating sets fill="currentColor" on the use element. -->
