<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    Icon sprite, FRONTEND.md A.7. 24px grid, 1.75 stroke, currentColor, round
    caps and joins. Self hosted like everything else, tech.md section 2.

    Use: <svg class="h-6 w-6" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#i-phone"></use></svg>

    The stroke lives in presentation attributes on every symbol rather than in
    a <style> block. A <use> that points at another file clones the symbol into
    a shadow tree in the host document, and a stylesheet inside this file does
    not reliably travel with it; presentation attributes are part of the nodes
    and always do. currentColor is the one thing left to the page, which is the
    point: an icon takes the colour of the text beside it.

    An icon never stands alone in place of a word. The two that do, the burger
    and the close button, carry an aria-label instead, A.7.
  -->

  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5a2 2 0 0 1 2-2h2.2a1 1 0 0 1 1 .78l.8 3.2a1 1 0 0 1-.5 1.1L8 9.2a13 13 0 0 0 6.8 6.8l1.12-1.5a1 1 0 0 1 1.1-.5l3.2.8a1 1 0 0 1 .78 1V18a2 2 0 0 1-2 2h-1C9.6 20 4 14.4 4 6z" />
  </symbol>

  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="1" />
    <path d="m3.5 6.5 8.5 6 8.5-6" />
  </symbol>

  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" />
    <circle cx="12" cy="10" r="2.5" />
  </symbol>

  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 6.75v5.5l3.25 2" />
  </symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="1" />
    <path d="M8 3v4M16 3v4M3 10h18" />
  </symbol>

  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12h15" />
    <path d="m13 6 6 6-6 6" />
  </symbol>

  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 6 12 12M18 6 6 18" />
  </symbol>

  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14" />
  </symbol>

  <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14" />
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m4.5 12.5 5 5 10-10" />
  </symbol>

  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M4 12h16M4 17h16" />
  </symbol>

  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18" />
    <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z" />
  </symbol>

  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v11" />
    <path d="m7 11 5 5 5-5" />
    <path d="M4.5 20h15" />
  </symbol>

  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h6v6" />
    <path d="M20 4 11.5 12.5" />
    <path d="M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" />
  </symbol>
</svg>
