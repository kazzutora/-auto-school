[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osk"
version = "0.1.0"
description = "OSK Nawrocki, driving school website (Wielun)"
requires-python = ">=3.12"

# Runtime stack is frozen in tech.md section 2. Nothing lands here without a
# core version bump.
dependencies = [
    "Django>=5.1,<5.2",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.4,<6",
    "redis>=5.0,<6",
    "django-environ>=0.11,<1",
    "django-solo>=2.3,<3",
    "django-cotton>=1.3,<2",
    "django-modeltranslation>=0.19,<1",
    "django-imagekit>=5.0,<6",
    "Pillow>=10.4,<12",
    "django-crispy-forms>=2.3,<3",
    "crispy-tailwind>=1.0,<2",
    "django-ratelimit>=4.1,<5",
    "whitenoise>=6.7,<7",
    "gunicorn>=23.0,<24",
    "sentry-sdk>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5.0,<8",
    "factory-boy>=3.3,<4",
    "hypothesis>=6.112,<7",
    "playwright>=1.47,<2",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "django-stubs>=5.0,<6",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tech.md is append-only and its snippets are contract specs, not runnable
# python: ruff must never rewrite them.
extend-exclude = ["**/migrations/*.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "scripts"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "apps.*"
disallow_untyped_defs = true

# Neither django-environ nor celery ships a py.typed marker.
[[tool.mypy.overrides]]
module = ["environ.*", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
