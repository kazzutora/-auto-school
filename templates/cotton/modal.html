<c-vars id="" title="" />
<div x-data="{ open: false }" x-on:open-modal.window="if ($event.detail === '{{ id }}') open = true" x-on:keydown.escape.window="open = false" {{ attrs }}>
  <div x-cloak x-show="open" class="fixed inset-0 z-50 flex items-center justify-center bg-ink-900/60 p-4">
    <div x-on:click.outside="open = false" role="dialog" aria-modal="true" aria-labelledby="{{ id }}_title" class="w-full max-w-lg rounded-xl bg-paper-0 p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <h2 id="{{ id }}_title" class="font-display text-xl font-bold text-brand-900">{{ title }}</h2>
        <button type="button" x-on:click="open = false" aria-label="Zamknij" class="text-ink-500 hover:text-ink-900">&times;</button>
      </div>
      <div class="mt-4 text-ink-700">{{ slot }}</div>
    </div>
  </div>
</div>
