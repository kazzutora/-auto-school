<c-vars name="" type="text" value="" error="" placeholder="" />
<input type="{{ type }}" name="{{ name }}" id="id_{{ name }}" value="{{ value }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if error %}aria-invalid="true" aria-describedby="err_{{ name }}"{% endif %} class="w-full rounded-lg border bg-paper-0 px-3 py-2.5 text-ink-900 placeholder:text-ink-500/70 focus-visible:outline-none{% if error %} border-state-err{% else %} border-paper-100{% endif %}" {{ attrs }}>
{% if error %}<p id="err_{{ name }}" class="mt-1 text-sm text-state-err">{{ error }}</p>{% endif %}
