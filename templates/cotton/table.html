<c-vars headers="" />
<div class="overflow-x-auto rounded-xl border border-paper-100">
  <table class="w-full min-w-full border-collapse text-left" {{ attrs }}>
    {% if headers %}<thead class="bg-paper-50">
      <tr>{% for header in headers %}<th scope="col" class="px-4 py-3 font-display text-sm font-bold uppercase tracking-wide text-ink-700">{{ header }}</th>{% endfor %}</tr>
    </thead>{% endif %}
    <tbody class="divide-y divide-paper-100">{{ slot }}</tbody>
  </table>
</div>
