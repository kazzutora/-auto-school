<c-vars images="" columns="3" />
<ul class="grid gap-4 grid-cols-2{% if columns == '2' or columns == 2 %} sm:grid-cols-2{% elif columns == '4' or columns == 4 %} sm:grid-cols-3 lg:grid-cols-4{% else %} sm:grid-cols-3{% endif %}" {{ attrs }}>
  {% for image in images %}<li class="overflow-hidden rounded-xl border border-paper-100">
    <c-picture :image="image.image" alt="{{ image.alt }}" ratio="square" sizes="(min-width: 640px) 33vw, 50vw" />
    {% if image.caption %}<p class="p-2 text-sm text-ink-500">{{ image.caption }}</p>{% endif %}
  </li>{% endfor %}
</ul>
