<c-vars field="" label="" help="" required="" />
<div class="mb-4" {{ attrs }}>
  <label for="{{ field.id_for_label }}" class="mb-1 block font-display text-sm font-bold text-ink-900">
    {% if label %}{{ label }}{% else %}{{ field.label }}{% endif %}{% if required or field.field.required %}<span class="text-state-err" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if help %}<p class="mt-1 text-sm text-ink-500">{{ help }}</p>{% elif field.help_text %}<p class="mt-1 text-sm text-ink-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-state-err">{{ error }}</p>{% endfor %}
</div>
