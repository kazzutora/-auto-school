<c-vars id="" tone="default" />
<section {% if id %}id="{{ id }}"{% endif %} class="py-12 sm:py-16{% if tone == 'muted' %} bg-paper-50{% elif tone == 'brand' %} bg-brand-900 text-paper-0{% endif %}" {{ attrs }}>
  <div class="mx-auto w-full max-w-6xl px-4">
    {% if heading %}<h2 class="font-display text-3xl font-bold tracking-tight sm:text-4xl{% if tone == 'brand' %} text-paper-0{% else %} text-brand-900{% endif %}">{{ heading }}</h2>{% endif %}
    {% if sub %}<p class="mt-3 max-w-2xl text-lg{% if tone == 'brand' %} text-brand-100{% else %} text-ink-500{% endif %}">{{ sub }}</p>{% endif %}
    <div class="{% if heading or sub %}mt-8{% endif %}">{{ slot }}</div>
  </div>
</section>
