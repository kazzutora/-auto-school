<header class="sticky top-0 z-30 border-b border-paper-100 bg-paper-0/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
    <a href="/" class="font-display text-xl font-bold tracking-tight text-brand-900">
      {{ site_settings.short_name|default:"OSK Nawrocki" }}
    </a>

    <div class="flex items-center gap-2">
      <c-nav class="order-2 lg:order-1" />
      <c-lang-switcher class="order-1 lg:order-2" />
      {% if site_settings.phone_primary %}
        <c-button size="sm" href="tel:{{ site_settings.phone_primary|cut:' ' }}" class="hidden sm:inline-flex">
          {{ site_settings.phone_primary }}
        </c-button>
      {% endif %}
    </div>
  </div>
</header>
