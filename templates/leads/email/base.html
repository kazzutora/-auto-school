{# Email layout. Inline styles only: mail clients strip <style> blocks and every
   external stylesheet, and tech.md section 2 bans third party assets anyway.
   Colours are the frozen tokens from tech.md section 7. #}
<!doctype html>
<html lang="{{ language|default:'pl' }}">
<head>
  <meta charset="utf-8">
  <title>{% block subject %}{% endblock %}</title>
</head>
<body style="margin:0;padding:24px 12px;background:#FAFAFA;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#0E0E10;">
  <div style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:8px;padding:24px;">
    <p style="margin:0 0 20px;font-size:18px;font-weight:bold;color:#2A2060;">{{ site.short_name }}</p>
    {% block content %}{% endblock %}
    <hr style="border:0;border-top:1px solid #D9D9D6;margin:24px 0 16px;">
    <p style="margin:0;font-size:13px;line-height:1.6;color:#5C5C66;">
      {{ site.legal_name }}<br>
      {{ site.street }}, {{ site.postal_code }} {{ site.city }}<br>
      <a href="tel:{{ site.phone_primary }}" style="color:#2A2060;">{{ site.phone_primary }}</a>{% if site.phone_secondary %},
      <a href="tel:{{ site.phone_secondary }}" style="color:#2A2060;">{{ site.phone_secondary }}</a>{% endif %}<br>
      <a href="mailto:{{ site.email }}" style="color:#2A2060;">{{ site.email }}</a>
    </p>
  </div>
</body>
</html>
